    <!-- Adding music and clicking sfx -->
    <script>
      document.addEventListener("click", ()=> {
        const start = document.getElementById("StartUp");
        const music = document.getElementById("bgMusic");
        const clicksfx = document.getElementById("Click");

        start.play()

        start.onended = () => {
          music.play();
        };
      }, {once: true});

      const clickSound = new Audio("Sfx/Click.wav");
      clickSound.preload = "auto";

      document.addEventListener("click", () =>{
        const soundClone = clickSound.cloneNode();
        soundClone.volume = .1;
        soundClone.play();
      });
    </script>

    <!-- Adding (and updating) clock */ -->
    <script>

      function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit'});
      document.getElementById('clock').textContent = "95% Confidence Value Clock -> " + timeString;
      }

      updateClock()
      setInterval(updateClock, 5000)

      const now = new Date();
      const options = {
        weekday: 'short',
        month: 'numeric',
        day: 'numeric',
        year: '2-digit'
      };

      const dateString = now.toLocaleDateString('en-US', options).replace(',','');
      document.getElementById('date').textContent = dateString;
    </script>

    <!-- Scroll speed and random select script-->
    <script>
      let messages = [];
      const speedInPixelsPerSecond = 150;

      async function loadMessages() {
        const response = await fetch("TopScroll.txt");
        const text = await response.text();
        messages = text.split('\n').map(m => m.trim()).filter(m => m.length > 0);
      }

      function startNextScroll() {
      const textElement = document.querySelector('.scrolling-text');

      const randomMessage = messages[Math.floor(Math.random() * messages.length)];

      textElement.textContent = randomMessage;

      // Reset animation so browser registers this is a new animation
      textElement.style.animation = 'none';
      textElement.offsetHeight; // Trigger DOM reflow
      
      const duration = textElement.offsetWidth / speedInPixelsPerSecond;

      textElement.style.animation = `marquee ${duration}s linear 1`;
      }

      window.addEventListener('DOMContentLoaded', () => {
          const textElement = document.querySelector('.scrolling-text');

          if (textElement) {
            textElement.addEventListener('animationend', () => {
              // Fixed: Math.random() with parentheses
              const pauseDelay = Math.floor(Math.random() * 1000) + 1000;
              setTimeout(startNextScroll, pauseDelay);
            });
          }

          loadMessages();
        });
    </script>

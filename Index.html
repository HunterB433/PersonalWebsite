    <audio id="StartUp" src="Sfx/Start.wav" preload="auto"></audio>
    <audio id="bgMusic" src="Sfx/Menu.mp3" loop preload="auto"></audio>
    <audio id="Click" src="Sfx/Click.wav" preload="auto"></audio>

    <script>
      document.addEventListener("click", ()=> {
        const start = document.getElementById("StartUp");
        const music = document.getElementById("bgMusic");
        const clicksfx = document.getElementById("Click");

        start.play()

        start.onended = () => {
          music.play();
        };
      }, {once: true});

      const clickSound = new Audio("Sfx/Click.wav");
      clickSound.preload = "auto";

      document.addEventListener("click", () =>{
        const soundClone = clickSound.cloneNode();
        soundClone.play();
      });

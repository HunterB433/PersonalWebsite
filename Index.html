    <audio id="StartUp" src="Sfx/Start.wav" preload="auto"></audio>
    <audio id="bgMusic" src="Sfx/Menu.mp3" loop preload="auto"></audio>
    <audio id="Click" src="Sfx/Click.wav" preload="auto"></audio>

    <!-- Adding music and clicking sfx -->
    <script>
      document.addEventListener("click", ()=> {
        const start = document.getElementById("StartUp");
        const music = document.getElementById("bgMusic");
        const clicksfx = document.getElementById("Click");

        start.play()

        start.onended = () => {
          music.play();
        };
      }, {once: true});

      const clickSound = new Audio("Sfx/Click.wav");
      clickSound.preload = "auto";

      document.addEventListener("click", () =>{
        const soundClone = clickSound.cloneNode();
        soundClone.volume = .1;
        soundClone.play();
      });
    </script>

    <!-- Adding (and updating) clock */ -->
    <script>

      function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit'});
      document.getElementById('clock').textContent = "95% Confidence Value Clock -> " + timeString;
      }

      updateClock()
      setInterval(updateClock, 5000)

      const now = new Date();
      const options = {
        weekday: 'short',
        month: 'numeric',
        day: 'numeric',
        year: '2-digit'
      };

      const dateString = now.toLocaleDateString('en-US', options).replace(',','');
      document.getElementById('date').textContent = dateString;
    </script>
